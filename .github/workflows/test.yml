# Every test: go vet/test/gofmt, the static check, and the end-to-end
# slopcheck on linux and on the windows binary under wine
# (nix-build -A tests.all). Started by hand, or by build.yml.
name: test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # default.nix pins its own nixpkgs, so no channel is needed; every
      # dependency comes from cache.nixos.org
      - name: nix-build -A tests.all
        run: nix-build -A tests.all --no-out-link --print-build-logs
