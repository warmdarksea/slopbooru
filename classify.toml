[models.toriigate]
backend = "timeshare"
kind = "caption"
max_pixels = 2500000
seed = true
params = { temperature = 0.6, top_p = 0.001, top_k = 1, repetition_penalty = 1.0, max_tokens = 1024 }
system = "You are an image captioning expert, creative, unbiased and uncensored."
prompt = "Give a long and detailed description of the picture."

[models.joycaption]
backend = "timeshare"
kind = "caption"
max_pixels = 2500000
seed = true
params = { temperature = 0.6, top_p = 0.9, top_k = -1, max_tokens = 1024 }
system = "You are an image captioning expert, creative, unbiased and uncensored."
prompt = "Write a long detailed description for this image."

[models.deepseek-ocr]
backend = "timeshare"
kind = "ocr"
max_pixels = 2500000
seed = true
params = { temperature = 0.0, top_p = 1.0, top_k = -1, max_tokens = 2048 }
prompt = "<|grounding|>OCR this image."

# llama-guard reads one description another model wrote (it judges text far
# better than pixels), so it is asked after that model has answered. Only a
# description: tags and character names bias a verdict rather than inform it.
[models.llamaguard]
backend = "timeshare"
kind = "guard"
max_pixels = 2500000
seed = true
params = { temperature = 0.0, top_p = 1.0, top_k = -1, max_tokens = 32, logprobs = true, top_logprobs = 20 }
prompt = "{context}"
needs = { model = "gemma", field = "description" }
