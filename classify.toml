# slopbooru classify: which models are asked about the pictures, where,
# and how. This file is built in; a --config file is read on top of it,
# and replaces a [backends.NAME] or [models.NAME] whole (enabled = false
# drops a model).
#
# A backend is anything that speaks the OpenAI API: gpu-timeshare with the
# fleet (the default), a single vllm or llama.cpp server, a hosted API.
#
# A model is asked one question per picture: its prompt, with the picture
# (downscaled past max_pixels) inline as a data: URL, plus params (any
# request field: sampling, logprobs, vllm's extensions). Change anything
# here and the question changes: the next run asks again, and the answer
# is stored beside the old one. Its kind says how slopbooru reads the
# answer:
#
#   fields   a JSON object (the schema below): description, text, tags,
#            emotion, subjects, rating, dimensionality, confidence
#   caption  free text: a description
#   ocr      text, with deepseek-ocr's <|grounding|> boxes when present
#   guard    llama-guard's safe/unsafe + hazard codes; the verdict's
#            confidence comes from its logprobs
#   tagger   pixai's contribution as JSON (tags, subjects, source, rating
#            with per-value scores)

[backends.timeshare]
url = "http://127.0.0.1:8100/v1"
token_env = "SLOPBOORU_TOKEN"   # or token = "...", or token_file = "..."
# cacert = "timeshare.crt"      # a self-signed server's certificate
mode = "batch"                  # batch: the Batch API; requests: one request each
batch_bytes = "190MB"           # the largest input file (OpenAI's limit is 200 MB)
concurrency = 8                 # requests mode: in flight at once
poll = "15s"                    # batch mode: how often to ask how it's going
window = "7d"                   # batch mode: completion_window (OpenAI accepts only 24h)

[models.pixai]
backend = "timeshare"
kind = "tagger"
max_pixels = 0                  # the tagger resizes to 1008 itself

# The schema's keys are sorted, and that matters: with "description" before
# "confidence", gemma degenerates into ", " strings (tested on the card,
# 2026-11-08); with "confidence" first it answers properly. Keep them sorted
# (slopbooru sends them sorted whatever the order here).
[models.qwen]
backend = "timeshare"
kind = "fields"
max_pixels = 2500000
seed = true                     # a per-picture seed: a re-run reproduces the sample
params = { temperature = 0.2, top_p = 0.95, top_k = 20, max_tokens = 2048, chat_template_kwargs = { enable_thinking = false } }
prompt = """
Analyze this image and fill in every JSON field. description: two to four sentences describing the image. text: a verbatim transcription of all readable text in reading order, or null if there is none. tags: 10-30 danbooru-style tags (lowercase_with_underscores). emotion: the emotions conveyed -- overall for the image as a whole, plus one entry per depicted subject. subjects: one entry per depicted character or person; name is their proper name when you can identify them, otherwise a short descriptor like 'blonde witch girl'; probability is your 0-1 confidence that the identification is correct (low when guessing). rating: the content rating on the danbooru scale: safe, sensitive, questionable, or explicit. dimensionality: 2d for drawn, painted, anime or illustrated images, 3d for photographs and 3d renders. confidence: your own 0-1 confidence in each of the other fields -- be honest and use the low end when you are unsure, this is recorded next to the value."""
schema = '''
{
  "additionalProperties": false,
  "properties": {
    "confidence": {
      "additionalProperties": false,
      "properties": {
        "description": {
          "maximum": 1,
          "minimum": 0,
          "type": "number"
        },
        "dimensionality": {
          "maximum": 1,
          "minimum": 0,
          "type": "number"
        },
        "emotion": {
          "maximum": 1,
          "minimum": 0,
          "type": "number"
        },
        "rating": {
          "maximum": 1,
          "minimum": 0,
          "type": "number"
        },
        "tags": {
          "maximum": 1,
          "minimum": 0,
          "type": "number"
        },
        "text": {
          "maximum": 1,
          "minimum": 0,
          "type": "number"
        }
      },
      "required": [
        "description",
        "text",
        "tags",
        "emotion",
        "rating",
        "dimensionality"
      ],
      "type": "object"
    },
    "description": {
      "type": "string"
    },
    "dimensionality": {
      "enum": [
        "2d",
        "3d"
      ],
      "type": "string"
    },
    "emotion": {
      "additionalProperties": false,
      "properties": {
        "overall": {
          "type": "string"
        },
        "subjects": {
          "items": {
            "additionalProperties": false,
            "properties": {
              "emotion": {
                "type": "string"
              },
              "subject": {
                "type": "string"
              }
            },
            "required": [
              "subject",
              "emotion"
            ],
            "type": "object"
          },
          "type": "array"
        }
      },
      "required": [
        "overall",
        "subjects"
      ],
      "type": "object"
    },
    "rating": {
      "enum": [
        "safe",
        "sensitive",
        "questionable",
        "explicit"
      ],
      "type": "string"
    },
    "subjects": {
      "items": {
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string"
          },
          "probability": {
            "maximum": 1,
            "minimum": 0,
            "type": "number"
          }
        },
        "required": [
          "name",
          "probability"
        ],
        "type": "object"
      },
      "type": "array"
    },
    "tags": {
      "items": {
        "type": "string"
      },
      "type": "array"
    },
    "text": {
      "type": [
        "string",
        "null"
      ]
    }
  },
  "required": [
    "description",
    "text",
    "tags",
    "emotion",
    "subjects",
    "rating",
    "dimensionality",
    "confidence"
  ],
  "type": "object"
}
'''

